gradle.projectsEvaluated {
 def app = gradle.rootProject.findProject(':app')
 if (app == null) return
 app.tasks.register('mediaCenterReleaseDependencyInventory') {
  doLast {
   def rows = app.configurations.releaseRuntimeClasspath.incoming.resolutionResult.allComponents.findAll { it.id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }.collect { c ->
    [group:c.id.group, name:c.id.module, version:c.id.version]
   }.sort { a,b -> (a.group+':'+a.name+':'+a.version) <=> (b.group+':'+b.name+':'+b.version) }
   def target = new File(gradle.rootProject.projectDir, '../../artifacts/mobile-source-release/maven-runtime.json').canonicalFile
   target.parentFile.mkdirs()
   target.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(rows))
   println 'Recorded '+rows.size()+' resolved external runtime components.'
  }
 }
}
